[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiofusion"
version = "0.1.0"
description = "Investigação computacional de biomarcadores prognósticos em insuficiência cardíaca"
requires-python = ">=3.11"

[project.scripts]
cardiofusion-train = "cardiofusion.model.training:main"
cardiofusion-extract = "cardiofusion.data.extract_mimic:main"
cardiofusion-extract-vitals = "cardiofusion.data.extract_vitals:main"
cardiofusion-sample = "cardiofusion.data.sample_cohort:main"
cardiofusion-export = "cardiofusion.data.export_folders:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardiofusion = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]
# black formata células de notebook nativamente (extra `jupyter`)
include = '\.pyi?$|\.ipynb$'

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff lê notebooks nativamente desde a 0.6.0
extend-exclude = ["data", "reports", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort — ordenação de imports
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PD",  # pandas-vet
]
ignore = [
    "E501",   # comprimento de linha é responsabilidade do black
    "PD010",  # `.pivot` é intencional: `.pivot_table` agregaria duplicatas em silêncio
]

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports fora do topo e expressões soltas na última linha são idiomáticos
"*.ipynb" = ["E402", "B018"]

[tool.ruff.lint.isort]
known-first-party = ["cardiofusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
